<!DOCTYPE html>
<html>
<head>
    <title>Heatwave Hotspot Gallery</title>
</head>

<body style="font-family:Arial; background-color:#f4f7f8;">

<h1 style="text-align:center; color:#263238;">
    Heatwave Hotspot Gallery
</h1>

<div style="display:flex; flex-wrap:wrap; gap:20px; justify-content:center;">

    <img src="map.jpg"
         alt="Heatwave Regional Map"
         style="width:250px; height:170px; object-fit:cover; border:3px solid #607d8b; border-radius:8px; transition:transform 0.4s;"
         onmouseover="this.style.transform='scale(1.08)'"
         onmouseout="this.style.transform='scale(1)'">

    <img src="north.jpg"
         alt="North Zone"
         style="width:250px; height:170px; object-fit:cover; border:3px solid #607d8b; border-radius:8px; transition:transform 0.4s;"
         onmouseover="this.style.transform='scale(1.08)'"
         onmouseout="this.style.transform='scale(1)'">

    <img src="central.jpg"
         alt="Central Zone"
         style="width:250px; height:170px; object-fit:cover; border:3px solid #607d8b; border-radius:8px; transition:transform 0.4s;"
         onmouseover="this.style.transform='scale(1.08)'"
         onmouseout="this.style.transform='scale(1)'">

    <img src="south.jpg"
         alt="South Zone"
         style="width:250px; height:170px; object-fit:cover; border:3px solid #607d8b; border-radius:8px; transition:transform 0.4s;"
         onmouseover="this.style.transform='scale(1.08)'"
         onmouseout="this.style.transform='scale(1)'">

</div>

</body>
</html>
